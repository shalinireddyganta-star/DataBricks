# The main pipeline for Retail_Orders_Bundle

resources:
  pipelines:
    Retail_Orders_Bundle_etl:
      name: Retail_Orders_Bundle_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Retail_Orders_Bundle_etl"

      libraries:
        - glob:
            include: ../src/Retail_Orders_Bundle_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
