# This is a Declarative Automation Bundle definition for Retail_Orders_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Retail_Orders_Bundle
  uuid: a530479e-ba09-4f42-8a08-4f6a788a2501

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-75f3f777-70d3.cloud.databricks.com
    variables:
      catalog: hididev
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-75f3f777-70d3.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/shalinireddyganta@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shalinireddyganta@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hidiprod
      schema: bronze
    permissions:
      - user_name: shalinireddyganta@gmail.com
        level: CAN_MANAGE
